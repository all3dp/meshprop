name: Meshprop Release Workflow

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-ubuntu:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node: ["18", "20", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Cache NPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # A re-run keeps its original commit, so without this an old run could republish older binaries.
      - name: Require the tip of master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MASTER_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [[ "$GITHUB_SHA" != "$MASTER_SHA" ]]; then
            echo "Commit $GITHUB_SHA is no longer the tip of master ($MASTER_SHA), refusing to publish it" >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::862461421235:role/cicd-role-meshprop-prod
          aws-region: eu-west-1
          translate-env-variables: false
          allowed-account-ids: "862461421235"

      - name: Release
        run: npm run release

  release-macos:
    runs-on: macos-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node: ["18", "20", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Cache NPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # A re-run keeps its original commit, so without this an old run could republish older binaries.
      - name: Require the tip of master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MASTER_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [[ "$GITHUB_SHA" != "$MASTER_SHA" ]]; then
            echo "Commit $GITHUB_SHA is no longer the tip of master ($MASTER_SHA), refusing to publish it" >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::862461421235:role/cicd-role-meshprop-prod
          aws-region: eu-west-1
          translate-env-variables: false
          allowed-account-ids: "862461421235"

      - name: Release
        run: npm run release
